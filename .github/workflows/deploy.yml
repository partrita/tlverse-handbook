name: Render and Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Noto Sans CJK KR font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          sudo fc-cache -f -v

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true

      - name: Cache Local Pixi Environment
        id: cache-pixi-env
        uses: actions/cache@v4
        with:
          path: .pixi
          key: ${{ runner.os }}-pixi-env-${{ hashFiles('pixi.lock', 'pixi.toml') }}
          restore-keys: |
            ${{ runner.os }}-pixi-env-${{ hashFiles('pixi.lock') }}-

      - name: Setup R Environment (GitHub Packages)
        if: steps.cache-pixi-env.outputs.cache-hit != 'true'
        shell: bash
        run: |
          pixi run setup-r
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}

      - name: Render and Publish to GitHub Pages
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          pixi run quarto publish gh-pages mybook --no-browser --no-prompt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

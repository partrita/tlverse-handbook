name: Render and Deploy (Pages + PDF Release)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Pixi
        uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true

      - name: Setup R Environment (GitHub Packages)
        shell: bash
        run: |
          pixi run setup-r

      - name: Render Quarto Project to PDF
        shell: bash
        run: |
          pixi run quarto render mybook --to pdf --output-dir ./release_pdf

      - name: Render and Publish to GitHub Pages
        shell: bash
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          pixi run quarto publish gh-pages mybook --no-browser --no-prompt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release and Upload PDF
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          files: ./release_pdf/index.pdf
          body: "자동으로 렌더링된 최신 PDF 버전입니다. (v${{ github.run_number }})"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

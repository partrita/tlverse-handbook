project:
  type: book
  output-dir: _book

book:
  title: "`tlverse`와 함께하는 R에서의 타겟 러닝"
  author: "Mark van der Laan, Jeremy Coyle, Nima Hejazi, Ivana Malenica, Rachael Phillips, Alan Hubbard"
  date: "2026-02-21"
  language: ko
  chapters:
    - index.qmd
    - part: "I. 타겟 러닝의 기초"
      chapters:
        - 01-intro.qmd
        - 02-tlverse.qmd
        - 03-data.qmd
        - 04-roadmap.qmd
    - part: "II. 핵심 기계 학습 엔진"
      chapters:
        - 05-origami.qmd
        - 06-sl3.qmd
    - part: "III. TMLE 프레임워크 및 응용"
      chapters:
        - 07-tmle3.qmd
        - 08-tmle3mopttx.qmd
        - 09-tmle3shift.qmd
        - 10-tmle3mediate.qmd
        - 11-tmle3survival.qmd
    - references.qmd

bibliography: [book.bib, packages.bib]

knitr:
  opts_chunk:
    comment: ""
    collapse: true
    cache: false
    out.width: "80%"
    fig.align: "center"
    fig.width: 6
    fig.asp: 0.618
    message: false
    warning: false
    echo: true

format:
  html:
    theme: cosmo
    css: css/style.css
    toc: true
    code-fold: true
